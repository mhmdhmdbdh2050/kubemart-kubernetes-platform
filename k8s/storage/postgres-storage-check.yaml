apiVersion: v1
kind: Pod
metadata:
  name: postgres-storage-check
  namespace: kubemart
spec:
  containers:
    - name: storage-check
      image: busybox:1.36
      command:
        - sh
        - -c
        - sleep 3600
      volumeMounts:
        - name: postgres-data
          mountPath: /data
  volumes:
    - name: postgres-data
      persistentVolumeClaim:
        claimName: postgres-pvc
