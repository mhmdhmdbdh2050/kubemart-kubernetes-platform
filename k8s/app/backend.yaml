apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubemart-api
  namespace: kubemart
  labels:
    app: kubemart-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kubemart-api
  template:
    metadata:
      labels:
        app: kubemart-api
    spec:
      imagePullSecrets:
        - name: ecr-pull-secret
      containers:
        - name: api
          image: 771962256401.dkr.ecr.us-east-1.amazonaws.com/kubemart-api:v2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: kubemart-api
  namespace: kubemart
  labels:
    app: kubemart-api
spec:
  type: ClusterIP
  selector:
    app: kubemart-api
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
