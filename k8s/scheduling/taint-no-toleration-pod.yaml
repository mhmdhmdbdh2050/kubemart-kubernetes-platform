apiVersion: v1
kind: Pod
metadata:
  name: taint-no-toleration-demo
  namespace: kubemart
spec:
  nodeSelector:
    kubernetes.io/hostname: k8s-worker1
  containers:
    - name: demo
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "Pod without toleration started"
          sleep 3600
      resources:
        requests:
          cpu: "10m"
          memory: "16Mi"
        limits:
          cpu: "50m"
          memory: "32Mi"
