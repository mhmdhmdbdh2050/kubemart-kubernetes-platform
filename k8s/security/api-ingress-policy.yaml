apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubemart-api-ingress
  namespace: kubemart
spec:
  podSelector:
    matchLabels:
      app: kubemart-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: frontend
      ports:
        - protocol: TCP
          port: 8000
