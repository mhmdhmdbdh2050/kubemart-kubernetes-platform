apiVersion: batch/v1
kind: Job
metadata:
  name: completion-report
  namespace: kubemart
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 2
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        app: completion-report
    spec:
      restartPolicy: Never
      containers:
        - name: report
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "KubeMart Completion Report"
              echo "--------------------------"
              echo "Checking sample order records..."
              for order in 101 102 103; do
                echo "Processed order ID: $order"
                sleep 2
              done
              echo "Report completed successfully."
