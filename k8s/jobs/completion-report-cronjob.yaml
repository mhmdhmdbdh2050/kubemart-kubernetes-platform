apiVersion: batch/v1
kind: CronJob
metadata:
  name: completion-report-cron
  namespace: kubemart
spec:
  schedule: "*/1 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      completions: 1
      parallelism: 1
      backoffLimit: 2
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            app: completion-report-cron
        spec:
          restartPolicy: Never
          containers:
            - name: report
              image: busybox:1.36
              resources:
                requests:
                  cpu: "10m"
                  memory: "16Mi"
                limits:
                  cpu: "100m"
                  memory: "64Mi"
              command:
                - sh
                - -c
                - |
                  echo "KubeMart Scheduled Completion Report"
                  echo "Execution time: $(date -u)"
                  echo "Processing scheduled report..."
                  sleep 5
                  echo "Scheduled report completed successfully."
