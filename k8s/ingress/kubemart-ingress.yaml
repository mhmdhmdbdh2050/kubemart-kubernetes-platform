apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kubemart-ingress
  namespace: kubemart
  annotations:
    nginx.ingress.kubernetes.io/limit-rps: "10"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "2"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - kubemart.example.com
      secretName: kubemart-tls
  rules:
    - host: kubemart.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
