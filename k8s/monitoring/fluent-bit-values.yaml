kind: DaemonSet

image:
  repository: cr.fluentbit.io/fluent/fluent-bit
  tag: "5.1.3"
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: fluent-bit
  automountServiceAccountToken: true

rbac:
  create: true
  nodeAccess: false
  eventsAccess: false

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

flush: 1
logLevel: info

config:
  service: |
    [SERVICE]
        Daemon Off
        Flush 1
        Log_Level info
        Parsers_File /fluent-bit/etc/parsers.conf
        Parsers_File /fluent-bit/etc/conf/custom_parsers.conf
        HTTP_Server On
        HTTP_Listen 0.0.0.0
        HTTP_Port 2020
        Health_Check On

  inputs: |
    [INPUT]
        Name tail
        Path /var/log/containers/*.log
        multiline.parser docker, cri
        Tag kube.*
        DB /var/lib/fluent-bit/flb_kube.db
        Mem_Buf_Limit 10MB
        Skip_Long_Lines On
        Refresh_Interval 5

  filters: |
    [FILTER]
        Name kubernetes
        Match kube.*
        Kube_Tag_Prefix kube.var.log.containers.
        Merge_Log On
        Keep_Log On
        Labels Off

  outputs: |
    [OUTPUT]
        Name loki
        Match kube.*
        Host kubemart-loki.logging.svc.cluster.local
        Port 3100
        Labels job=fluent-bit
        Auto_Kubernetes_Labels Off
        Line_Format json
        Retry_Limit False

  customParsers: |
    [PARSER]
        Name docker_no_time
        Format json
        Time_Keep Off
        Time_Key time
        Time_Format %Y-%m-%dT%H:%M:%S.%L

  extraFiles: {}

volumeMounts:
  - name: config
    mountPath: /fluent-bit/etc/conf
  - name: state
    mountPath: /var/fluent-bit/state

daemonSetVolumes:
  - name: varlog
    hostPath:
      path: /var/log
  - name: state
    hostPath:
      path: /var/lib/fluent-bit
      type: DirectoryOrCreate

daemonSetVolumeMounts:
  - name: varlog
    mountPath: /var/log
    readOnly: true
  - name: state
    mountPath: /var/lib/fluent-bit

tolerations: []
