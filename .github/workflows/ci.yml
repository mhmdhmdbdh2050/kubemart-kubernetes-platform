name: Build and validate

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_images:
        description: Build and publish both images to the configured ECR repositories
        type: boolean
        required: true
        default: false
      deploy:
        description: Apply the selected KubeMart resources to the configured cluster
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  application:
    name: Compile, build, and validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Go for Kubeconform
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Compile backend source
        run: python -m compileall -q app/backend

      - name: Build backend image
        run: docker build -f app/backend/Dockerfile -t kubemart-api:ci app/backend

      - name: Build frontend image
        run: docker build -f app/frontend/Dockerfile -t kubemart-frontend:ci app/frontend

      - name: Install Kubeconform
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.6.7
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Lint and render the local Helm chart
        run: |
          helm lint k8s/helm/nginx-lab
          helm template nginx-lab k8s/helm/nginx-lab > "$RUNNER_TEMP/nginx-lab-rendered.yaml"

      - name: Validate Kubernetes manifests
        shell: bash
        run: |
          mapfile -d '' manifests < <(find k8s -type f -name '*.yaml' \
            ! -path 'k8s/helm/*' ! -path 'k8s/monitoring/*' -print0)
          if (( ${#manifests[@]} == 0 )); then
            echo "No Kubernetes manifests found under k8s/." >&2
            exit 1
          fi
          kubeconform -strict -ignore-missing-schemas -summary \
            "${manifests[@]}" "$RUNNER_TEMP/nginx-lab-rendered.yaml"

  publish-images:
    name: Publish images to ECR
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_images }}
    needs: application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    outputs:
      api-image: ${{ steps.image-names.outputs.api-image }}
      frontend-image: ${{ steps.image-names.outputs.frontend-image }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify ECR repositories exist
        env:
          ECR_API_REPOSITORY: ${{ vars.ECR_API_REPOSITORY }}
          ECR_FRONTEND_REPOSITORY: ${{ vars.ECR_FRONTEND_REPOSITORY }}
        run: |
          aws ecr describe-repositories \
            --region "${{ vars.AWS_REGION }}" \
            --repository-names "$ECR_API_REPOSITORY" "$ECR_FRONTEND_REPOSITORY"

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tags
        id: image-names
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_API_REPOSITORY: ${{ vars.ECR_API_REPOSITORY }}
          ECR_FRONTEND_REPOSITORY: ${{ vars.ECR_FRONTEND_REPOSITORY }}
        run: |
          echo "api-image=$REGISTRY/$ECR_API_REPOSITORY:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "frontend-image=$REGISTRY/$ECR_FRONTEND_REPOSITORY:$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: app/backend
          file: app/backend/Dockerfile
          push: true
          tags: ${{ steps.image-names.outputs.api-image }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: app/frontend
          file: app/frontend/Dockerfile
          push: true
          tags: ${{ steps.image-names.outputs.frontend-image }}

  deploy:
    name: Deploy to the self-managed cluster
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy && vars.KUBEMART_DEPLOYMENT_ENABLED == 'true' && needs.publish-images.result == 'success' }}
    needs:
      - application
      - publish-images
    runs-on: [self-hosted, linux, kubemart-cluster-access]
    environment: kubemart-deploy
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Prepare short-lived kubeconfig
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          if [ -z "$KUBECONFIG_B64" ]; then
            echo "KUBECONFIG_B64 is required for the gated deployment job." >&2
            exit 1
          fi
          install -d -m 700 "$RUNNER_TEMP/kube"
          printf '%s' "$KUBECONFIG_B64" | base64 --decode > "$RUNNER_TEMP/kube/config"
          chmod 600 "$RUNNER_TEMP/kube/config"
          echo "KUBECONFIG=$RUNNER_TEMP/kube/config" >> "$GITHUB_ENV"

      - name: Verify cluster access and required secrets
        run: |
          kubectl cluster-info

      - name: Create the namespace if needed
        run: kubectl apply -f k8s/namespace/namespace.yaml

      - name: Verify required namespace secrets
        run: kubectl -n kubemart get secret postgres-secret ecr-pull-secret kubemart-tls

      - name: Apply application manifests
        run: |
          kubectl apply -f k8s/config/frontend-config.yaml
          kubectl apply -f k8s/storage/kubemart-storageclass.yaml
          kubectl apply -f k8s/storage/postgres-pvc.yaml
          kubectl apply -f k8s/services/
          kubectl apply -f k8s/statefulsets/postgres-statefulset.yaml
          kubectl apply -f k8s/deployments/redis-deployment.yaml
          kubectl apply -f k8s/app/backend.yaml
          kubectl apply -f k8s/deployments/frontend-deployment.yaml
          kubectl apply -f k8s/ingress/kubemart-ingress.yaml
          kubectl apply -f k8s/autoscaling/frontend-hpa.yaml
          kubectl apply -f k8s/policies/frontend-pdb.yaml
          kubectl apply -f k8s/security/api-ingress-policy.yaml
          kubectl apply -f k8s/security/postgres-ingress-policy.yaml

      - name: Update images and verify rollouts
        env:
          API_IMAGE: ${{ needs.publish-images.outputs.api-image }}
          FRONTEND_IMAGE: ${{ needs.publish-images.outputs.frontend-image }}
        run: |
          kubectl -n kubemart set image deployment/kubemart-api api="$API_IMAGE"
          kubectl -n kubemart set image deployment/frontend nginx="$FRONTEND_IMAGE"
          kubectl -n kubemart rollout status deployment/kubemart-api --timeout=5m
          kubectl -n kubemart rollout status deployment/frontend --timeout=5m

      - name: Remove temporary kubeconfig
        if: always()
        run: rm -f "$RUNNER_TEMP/kube/config"
